<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nano SEO Lab · Analysis History</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="logs">
  <div class="product-page-header">
    <div class="product-lockup">
      <span class="lab-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M2 16h4l3-8 4 10 3-7h6"></path>
          <circle cx="6" cy="16" r="1.4"></circle>
          <circle cx="9" cy="8" r="1.4"></circle>
          <circle cx="13" cy="18" r="1.4"></circle>
          <circle cx="16" cy="11" r="1.4"></circle>
        </svg>
      </span>
      <span class="product-name">Nano SEO Lab</span>
    </div>
    <h1>Analysis history</h1>
    <p class="muted">Each page read starts a new run. Results and model calls stay grouped beneath that page snapshot.</p>
  </div>

  <div class="row" style="margin-top:20px">
    <button id="refreshBtn">Refresh</button>
    <button id="downloadBtn" class="secondary">Export history JSON</button>
    <button id="clearBtn" class="secondary">Clear history</button>
  </div>

  <div id="summary"></div>
  <div id="history"></div>

  <script src="history.js"></script>
</body>
</html>
