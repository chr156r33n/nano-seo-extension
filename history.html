<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nano SEO Lab History</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="logs">
  <h1>Nano SEO Lab analysis history</h1>

  <div class="row">
    <button id="refreshBtn">Refresh</button>
    <button id="downloadBtn" class="secondary">Download history JSON</button>
    <button id="clearBtn" class="secondary">Clear history</button>
  </div>

  <p class="muted">
    Each page capture starts a new analysis run. Model calls are grouped beneath that run.
  </p>

  <div id="summary"></div>
  <div id="history"></div>

  <script src="history.js"></script>
</body>
</html>
